name: shuno
description: "Shuno: a personal YouTube audio experiment."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  just_audio: 0.10.6
  audio_service: ^0.18.19
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  youtube_explode_dart: 3.1.0
  http: ^1.2.0
  file_picker: ^13.1.0
  flutter_pdfview: ^1.4.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/shuno.png"
  adaptive_icon_background: "#0D6B3C"
  adaptive_icon_foreground: "assets/shuno_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/shuno.png
    - assets/shuno_splash.png
