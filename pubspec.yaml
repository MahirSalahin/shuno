name: shuno
description: "Shuno: a personal YouTube audio experiment."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  just_audio: 0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  youtube_explode_dart: 3.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/shuno.png"

flutter:
  uses-material-design: true
  assets:
    - assets/shuno.png
